aid: imvu
name: Together Labs
description: 'Together Labs (Palo Alto, California) is the company behind IMVU, the 3D avatar-based
  social network and virtual-goods marketplace, alongside MetaJuice, its blockchain arm, and the VCOIN
  transferable digital currency. Its developer surface is unusual for a consumer platform: the public
  developer program that once issued API keys was retired, but api.imvu.com remains a live, publicly
  readable hypermedia REST API — a "denormalized" node envelope over users, products, rooms and
  derivation relationships — and Together Labs publishes a genuinely documented, first-party in-world
  scripting API for IMVU rooms in Lua/Luau on GitHub, complete with an event model, an imvu.* method
  surface, a persistent key/value data module and published resource limits. Neither surface ships an
  OpenAPI, an AsyncAPI, an MCP server, an agent card or an llms.txt.'
