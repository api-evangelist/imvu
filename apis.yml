apis:
- name: IMVU Room Scripting API
  description: 'First-party in-world scripting API for IMVU Live Rooms. Room scripts are single-file
    Lua programs executed server-side in a Luau sandbox; the engine calls event functions
    (event_start, event_begin_iteration, event_message_received, event_state_changed,
    event_tip_received, event_end_iteration, event_stop) roughly 20 times a second, and scripts call
    back into an imvu.* method surface to chat, whisper, place and remove furniture, move and remove
    scene members, send room invites, control embedded YouTube media, create polls and read audience
    or scene membership. A data.save / data.load module provides persistent key/value storage scoped
    to script, room, account or individual visitor. Published as a VIP-only alpha; documentation and
    nine worked example scripts are published by IMVU on GitHub.'
  humanURL: https://github.com/imvu/imvu-scripting-docs
