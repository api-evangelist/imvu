- name: IMVU REST API
  description: 'Production hypermedia REST API serving IMVU''s own web and mobile clients. It is
    publicly reachable and a meaningful slice of it answers unauthenticated: GET /product/product-<id>,
    /user/user-<id> and /room return a "denormalized" node envelope carrying data, relations and a
    per-node http block, with collection endpoints paginated by limit and start_index. Together Labs
    publishes no reference documentation, no OpenAPI and no key-issuance process for it — the public
    developer program that issued API keys was retired — so everything recorded here was established
    by probing the live host, not read from a contract.'
  baseURL: https://api.imvu.com
